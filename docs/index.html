<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>LetWise</title>
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --border: #e2e5ea;
  --text: #1c2230;
  --muted: #667085;
  --brand: #1f5eff;
  --brand-ink: #ffffff;
  --brand-soft: #e8efff;
  --sidebar: #111827;
  --sidebar-text: #cbd2dc;
  --sidebar-active: #1f2a3d;
  --ok: #117a45;
  --ok-soft: #e3f5ea;
  --warn: #9a5b00;
  --warn-soft: #fff3dc;
  --bad: #b42318;
  --bad-soft: #fde8e6;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e1117;
    --surface: #161b24;
    --surface-2: #1c2330;
    --border: #283142;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --brand: #5b8cff;
    --brand-ink: #0b1020;
    --brand-soft: #1b2a4d;
    --sidebar: #0a0d13;
    --sidebar-text: #aeb7c4;
    --sidebar-active: #1a2233;
    --ok: #4ade80;
    --ok-soft: #12301f;
    --warn: #fbbf24;
    --warn-soft: #3a2c0c;
    --bad: #f87171;
    --bad-soft: #3b1515;
    --shadow: none;
    color-scheme: dark;
  } }
:root[data-theme="dark"] {
    --bg: #0e1117;
    --surface: #161b24;
    --surface-2: #1c2330;
    --border: #283142;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --brand: #5b8cff;
    --brand-ink: #0b1020;
    --brand-soft: #1b2a4d;
    --sidebar: #0a0d13;
    --sidebar-text: #aeb7c4;
    --sidebar-active: #1a2233;
    --ok: #4ade80;
    --ok-soft: #12301f;
    --warn: #fbbf24;
    --warn-soft: #3a2c0c;
    --bad: #f87171;
    --bad-soft: #3b1515;
    --shadow: none;
    color-scheme: dark;
  }


* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.6rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
h3 { font-size: 1rem; margin: 0 0 .4rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.pre { white-space: pre-wrap; }

/* ---------- layout ---------- */
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--sidebar) 240px, transparent 240px); }
.sidebar {
  background: var(--sidebar); color: var(--sidebar-text);
  padding: 20px 14px; display: flex; flex-direction: column; gap: 6px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar .brand { color: #fff; }
.sidebar .agency { font-size: .8rem; padding: 0 8px 10px; opacity: .8; }
.sidebar nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.sidebar nav a { color: var(--sidebar-text); padding: 7px 10px; border-radius: 7px; }
.sidebar nav a:hover { background: var(--sidebar-active); text-decoration: none; color: #fff; }
.sidebar nav a.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
.nav-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; opacity: .55; padding: 14px 10px 4px; }
.sidebar .me { border-top: 1px solid rgba(255,255,255,.08); padding: 12px 8px 0; font-size: .9rem; color: #fff; }
.sidebar .me .muted { color: var(--sidebar-text); }
.link-btn { background: none; border: 0; padding: 6px 0 0; color: var(--sidebar-text); cursor: pointer; font: inherit; text-decoration: underline; }
.content { padding: 28px 32px 60px; max-width: 1300px; width: 100%; min-width: 0; }

.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--text); padding: 0 8px 4px; }
.brand:hover { text-decoration: none; }
.brand.big { font-size: 1.4rem; }
.logo { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-weight: 800; }

.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head p { margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions form { margin: 0; }
.crumb { font-size: .85rem; display: inline-block; margin-bottom: 4px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2 { margin: 0; }
.count { font-size: .8rem; color: var(--muted); background: var(--surface-2); padding: 2px 8px; border-radius: 99px; margin-left: 4px; font-weight: 500; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-2 .card { margin-bottom: 0; }

/* ---------- tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 2px; color: var(--text); box-shadow: var(--shadow); }
a.tile:hover { border-color: var(--brand); text-decoration: none; }
.tile .label { font-size: .8rem; color: var(--muted); }
.tile .value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .value.sm { font-size: 1.1rem; }
.tile .sub { font-size: .8rem; color: var(--muted); }
.tile.alert { border-color: var(--bad); background: var(--bad-soft); }
.tile.alert .value { color: var(--bad); }
.tile.warn { border-color: var(--warn); background: var(--warn-soft); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
tbody tr:hover { background: var(--surface-2); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.neg { color: var(--bad); font-weight: 600; }
tr.sub td { color: var(--muted); font-style: italic; }
tr.total td { font-weight: 700; border-top: 2px solid var(--text); }

.badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text); text-transform: capitalize; white-space: nowrap; }
.badge.s-active, .badge.s-let, .badge.s-completed { background: var(--ok-soft); color: var(--ok); }
.badge.s-vacant, .badge.s-open, .badge.s-pending, .badge.warn, .badge.p-high, .badge.s-high { background: var(--warn-soft); color: var(--warn); }
.badge.s-suspended, .badge.bad, .badge.p-emergency, .badge.s-emergency, .badge.s-ended { background: var(--bad-soft); color: var(--bad); }
.badge.s-admin, .badge.s-in-progress { background: var(--brand-soft); color: var(--brand); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-left: 4px; }

/* ---------- forms ---------- */
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: var(--brand); }
input[type="radio"] { width: auto; }
label { font-size: .88rem; font-weight: 600; display: block; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack label input { margin-top: 4px; font-weight: 400; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.field label { margin-bottom: 4px; }
.field.wide, .wide { grid-column: 1 / -1; }
.req { color: var(--bad); }
.help { font-size: .8rem; color: var(--muted); margin-top: 3px; }
.field-err { font-size: .82rem; color: var(--bad); margin-top: 3px; }
.form-actions { display: flex; gap: 8px; padding-top: 6px; }
fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px 16px; margin: 0; }
legend { font-weight: 700; padding: 0 6px; }
.segmented { display: flex; gap: 16px; margin-bottom: 14px; }
.segmented label { display: flex; gap: 6px; align-items: center; font-weight: 500; }
[hidden] { display: none !important; }
.inline-form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin: 0; }
.inline-form > div { flex: 1 1 260px; }
.inline-form h2 { margin-bottom: 2px; }
.inline-form p { margin: 0; }
.inline-form label input, .inline-form label select { margin-top: 4px; font-weight: 400; }
.inline-form input, .inline-form select { width: auto; }
.search input { min-width: 240px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); white-space: nowrap;
}
.btn:hover { text-decoration: none; background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.small { padding: 5px 10px; font-size: .82rem; }

.notice { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: .92rem; }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.err { background: var(--bad-soft); color: var(--bad); }

/* ---------- detail pages ---------- */
.details { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 24px; margin: 0; }
.details dt { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.details dd { margin: 2px 0 0; }
.details .wide { grid-column: 1 / -1; }
.callout { display: flex; justify-content: space-between; align-items: center; background: var(--ok-soft); color: var(--ok); padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
.callout strong { font-size: 1.2rem; }
.callout.alert { background: var(--bad-soft); color: var(--bad); }
.danger-zone { border-color: var(--bad); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
.summary div { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; }
.summary span { font-size: .8rem; color: var(--muted); }

/* ---------- admin chart ---------- */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 10px; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.bar-fill { width: 100%; max-width: 44px; background: var(--brand); border-radius: 5px 5px 0 0; height: 2%; }
.bar-val { font-size: .75rem; font-weight: 600; }
.bar-label { font-size: .72rem; color: var(--muted); }

/* ---------- public pages ---------- */
.public { max-width: 1040px; margin: 0 auto; padding: 48px 16px; }
.auth .public { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
.narrow { max-width: 420px; width: 100%; }
.center { text-align: center; margin: 60px auto; }
.narrow h1 { margin: 14px 0 16px; }
.hero { padding: 40px 0 30px; max-width: 760px; }
.hero h1 { font-size: 2.4rem; line-height: 1.15; margin: 20px 0 14px; }
.lead { font-size: 1.1rem; color: var(--muted); margin-bottom: 24px; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.features .card { margin: 0; }
.features p { margin: 0; color: var(--muted); }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; background: none; }
  .sidebar { position: static; height: auto; }
  .sidebar nav { flex-direction: row; flex-wrap: wrap; }
  .nav-label { display: none; }
  .content { padding: 20px 16px 48px; }
  .grid-2, .form-grid { grid-template-columns: 1fr; }
  .search input { min-width: 0; width: 100%; }
  .hero h1 { font-size: 1.8rem; }
}

@media print {
  .sidebar, .no-print { display: none !important; }
  .shell { display: block; }
  body { background: #fff; color: #000; }
  .card { border: 0; box-shadow: none; padding: 0; }
}

/* ---------- invoices ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: -4px 0 12px; flex-wrap: wrap; }
.tabs a { padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600; font-size: .9rem; }
.tabs a:hover { text-decoration: none; color: var(--text); }
.tabs a.active { color: var(--brand); border-bottom-color: var(--brand); }
table.clickable tbody tr[data-href] { cursor: pointer; }
.file-box { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding: 12px 14px; background: var(--surface-2); border-radius: 8px; }
label.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }
label.check input { width: auto; margin-top: 4px; }
.spaced { margin-top: 16px; }

/* ---------- monthly statements ---------- */
.statement-doc h3 { margin: 22px 0 8px; }
.doc-head { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-bottom: 2px solid var(--text); padding-bottom: 14px; margin-bottom: 18px; }
.doc-head h2 { margin: 2px 0; }
.doc-agency { font-weight: 800; color: var(--brand); letter-spacing: .02em; }
.doc-to { text-align: right; }
.ai-summary { background: var(--brand-soft); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
.ai-summary p { margin: 4px 0 0; }
.ai-label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--brand); }
.summary.big strong { font-size: 1.2rem; }
.summary .hl { background: var(--ok-soft); color: var(--ok); }
.summary .hl span { color: var(--ok); }
@media print { .ai-summary { background: #f2f4f8; } .doc-agency { color: #000; } }

/* ---------- autosave ---------- */
.save-status { align-self: center; font-size: .85rem; color: var(--muted); }
.save-status.ok { color: var(--ok); }
.save-status.err { color: var(--bad); font-weight: 600; }
.save-status.busy { color: var(--warn); }
.link-btn.inline { color: inherit; padding: 0; margin-left: 6px; }
.export-link { display: inline-block; color: var(--sidebar-text); margin-top: 6px; }
.steps { margin: 0 0 10px; padding-left: 20px; }
.steps li { margin-bottom: 6px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }


/* ---------- preview additions ---------- */
.pv-note { font-size: .8rem; color: var(--muted); text-align: center; margin-top: 12px; }
.pv-toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  max-width: min(520px, calc(100% - 32px)); background: #0b1220; color: #fff;
  padding: 12px 16px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.3); font-size: .9rem; z-index: 50;
  display: flex; gap: 12px; align-items: center;
}
.pv-toast button { background: none; border: 0; color: #93b4ff; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>

<script>
const LOGIN_HTML = "\n\n\n\u003cdiv class=\"card narrow\">\n  \u003ca class=\"brand\" href=\"/\">\u003cspan class=\"logo\">L\u003c/span>LetWise\u003c/a>\n  \u003ch1>Sign in\u003c/h1>\n  \n  \u003cform method=\"post\" action=\"/login\" class=\"stack\">\n    \u003clabel>Username or email \u003cinput id=\"login\" name=\"login\" value=\"\" required autofocus autocomplete=\"username\" autocapitalize=\"none\" spellcheck=\"false\">\u003c/label>\n    \u003clabel>Password \u003cinput id=\"password\" type=\"password\" name=\"password\" required autocomplete=\"current-password\">\u003c/label>\n    \u003cbutton class=\"btn primary\" type=\"submit\">Sign in\u003c/button>\n  \u003c/form>\n  \n\u003c/div>\n\n";

(() => {
  const root = document.getElementById('pv-root');
  let account = null;   // signed-in username
  let current = null;   // current page url

  function toast(msg) {
    document.getElementById('pv-toast-text').textContent = msg;
    const t = document.getElementById('pv-toast');
    t.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { t.hidden = true; }, 4500);
  }
  document.getElementById('pv-toast-close').addEventListener('click', () => { document.getElementById('pv-toast').hidden = true; });

  const store = {
    get() { try { return sessionStorage.getItem('letwise-preview-user'); } catch (e) { return null; } },
    set(v) { try { v ? sessionStorage.setItem('letwise-preview-user', v) : sessionStorage.removeItem('letwise-preview-user'); } catch (e) { /* ignore */ } },
  };

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function showLogin(error) {
    account = null; current = null;
    document.title = 'Sign in · LetWise';
    document.body.className = 'auth';
    root.innerHTML = '<main class="public">' + LOGIN_HTML + '<p class="pv-note">Preview with sample data.</p></main>';
    if (error) {
      const form = root.querySelector('form');
      const note = document.createElement('div');
      note.className = 'notice err';
      note.textContent = error;
      form.parentNode.insertBefore(note, form);
    }
    const input = root.querySelector('#login');
    if (input) input.focus();
  }

  function render(url) {
    const acct = ACCOUNTS[account];
    const page = acct && acct.pages[url];
    if (!page) { toast('That page isn’t part of this preview.'); return; }
    current = url;
    document.title = page.title;
    document.body.className = '';
    root.innerHTML = '<div class="shell"><aside class="sidebar">' + acct.sidebar + '</aside><main class="content">' + page.main + '</main></div>';
    root.querySelectorAll('.bar-fill[data-h]').forEach((el) => { el.style.height = Math.max(2, Number(el.dataset.h)) + '%'; });
    window.scrollTo(0, 0);
  }

  function go(url) {
    const pages = ACCOUNTS[account].pages;
    if (pages[url]) return render(url);
    const path = url.split('?')[0];
    if (pages[path]) return render(path);
    if (/\/new(\?|$)|\/edit$|\/add-tenant$/.test(path)) return toast('Adding and editing records works in the full app. This preview is read-only.');
    toast('That page isn’t part of this preview.');
  }

  document.addEventListener('click', (e) => {
    if (!account) return;
    const a = e.target.closest('a[href]');
    if (a) {
      const href = a.getAttribute('href');
      if (!href.startsWith('/')) return;
      e.preventDefault();
      if (/\/file(\?|$)|download=1/.test(href)) toast('In the full app this opens the uploaded invoice.');
      else if (/\/export$/.test(href)) toast('In the full app this downloads all of your agency’s data.');
      else if (/\.csv$/.test(href)) toast('In the full app this downloads the user list as a spreadsheet.');
      else if (/\/admin\/backups\/letwise-/.test(href)) toast('In the full app this downloads the backup file.');
      else go(href);
      return;
    }
    if (e.target.closest('[data-print]')) { toast('In the full app this prints the statement or saves it as a PDF.'); return; }
    const row = e.target.closest('tr[data-href]');
    if (row && !e.target.closest('a, button, input, select')) go(row.dataset.href);
  });

  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const action = form.getAttribute('action') || (current || '').split('?')[0];
    const method = (form.getAttribute('method') || 'get').toLowerCase();

    if (action === '/login') {
      const data = new FormData(form);
      const username = String(data.get('login') || '').trim().toLowerCase();
      const acct = ACCOUNTS[username];
      const ok = acct && (await sha256(acct.salt + ':' + String(data.get('password') || ''))) === acct.hash;
      if (!ok) return showLogin('Incorrect username or password.');
      account = username;
      store.set(username);
      return render(acct.home);
    }
    if (!account) return;
    if (action === '/logout') { store.set(null); return showLogin(); }
    if (method === 'get') {
      const params = new URLSearchParams();
      for (const [k, v] of new FormData(form)) if (typeof v === 'string' && v !== '') params.append(k, v);
      const url = action + (params.toString() ? '?' + params : '');
      if (ACCOUNTS[account].pages[url]) return render(url);
      return toast('Searching and filtering work in the full app. This preview shows the sample views only.');
    }
    toast('This preview is read-only. In the full app this saves your change.');
  });

  const remembered = store.get();
  if (remembered && ACCOUNTS[remembered]) { account = remembered; render(ACCOUNTS[remembered].home); } else showLogin();
})();
</script>
