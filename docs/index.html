<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --border: #e2e5ea;
  --text: #1c2230;
  --muted: #667085;
  --brand: #1f5eff;
  --brand-ink: #ffffff;
  --brand-soft: #e8efff;
  --sidebar: #111827;
  --sidebar-text: #cbd2dc;
  --sidebar-active: #1f2a3d;
  --ok: #117a45;
  --ok-soft: #e3f5ea;
  --warn: #9a5b00;
  --warn-soft: #fff3dc;
  --bad: #b42318;
  --bad-soft: #fde8e6;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e1117;
    --surface: #161b24;
    --surface-2: #1c2330;
    --border: #283142;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --brand: #5b8cff;
    --brand-ink: #0b1020;
    --brand-soft: #1b2a4d;
    --sidebar: #0a0d13;
    --sidebar-text: #aeb7c4;
    --sidebar-active: #1a2233;
    --ok: #4ade80;
    --ok-soft: #12301f;
    --warn: #fbbf24;
    --warn-soft: #3a2c0c;
    --bad: #f87171;
    --bad-soft: #3b1515;
    --shadow: none;
    color-scheme: dark;
  } }
:root[data-theme="dark"] {
    --bg: #0e1117;
    --surface: #161b24;
    --surface-2: #1c2330;
    --border: #283142;
    --text: #e6e9ef;
    --muted: #98a2b3;
    --brand: #5b8cff;
    --brand-ink: #0b1020;
    --brand-soft: #1b2a4d;
    --sidebar: #0a0d13;
    --sidebar-text: #aeb7c4;
    --sidebar-active: #1a2233;
    --ok: #4ade80;
    --ok-soft: #12301f;
    --warn: #fbbf24;
    --warn-soft: #3a2c0c;
    --bad: #f87171;
    --bad-soft: #3b1515;
    --shadow: none;
    color-scheme: dark;
  }


* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.6rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
h3 { font-size: 1rem; margin: 0 0 .4rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.pre { white-space: pre-wrap; }

/* ---------- layout ---------- */
.shell { display: grid; grid-template-columns: 64px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--sidebar) 64px, transparent 64px); }
.sidebar {
  background: var(--sidebar); color: var(--sidebar-text);
  padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; scrollbar-width: none;
}
.sidebar::-webkit-scrollbar { display: none; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; }
nav.rail { flex: 1; }
.rail-me { padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
.rail-me form { margin: 0; }
.rail-sep { width: 24px; height: 1px; background: rgba(255,255,255,.1); margin: 4px 0; }
.rail-btn {
  width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border-radius: 9px; border: 0; background: transparent; color: var(--sidebar-text);
  cursor: pointer; font: inherit; padding: 0; text-decoration: none;
  transition: background-color .12s, color .12s;
}
.rail-btn:hover, .rail-btn:focus-visible { background: var(--sidebar-active); color: #fff; text-decoration: none; }
.rail-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.rail-btn.active { background: var(--brand); color: #fff; }
.brand-btn { margin-bottom: 4px; }
.brand-btn:hover, .brand-btn.active { background: transparent; }
.brand-btn.active .logo { box-shadow: 0 0 0 2px var(--sidebar), 0 0 0 4px #fff; }
.avatar { background: var(--sidebar-active); color: #fff; font-size: .8rem; font-weight: 700; letter-spacing: .02em; }

/* Hover / focus label for the icon rail (positioned by app.js so it isn't clipped). */
.rail-tip {
  position: fixed; z-index: 100; pointer-events: none;
  background: #0b1220; color: #fff; font-size: .82rem; font-weight: 600; white-space: nowrap;
  padding: 6px 10px; border-radius: 7px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.rail-tip::before {
  content: ""; position: absolute; left: -5px; top: 50%; transform: translateY(-50%);
  border: 5px solid transparent; border-left: 0; border-right-color: #0b1220;
}
.rail-tip.below::before { left: 50%; top: -5px; transform: translateX(-50%); border: 5px solid transparent; border-top: 0; border-bottom-color: #0b1220; }
.link-btn { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; font: inherit; text-decoration: underline; }
.content { padding: 28px 32px 60px; max-width: 1300px; width: 100%; min-width: 0; }

.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--text); padding: 0 8px 4px; }
.brand:hover { text-decoration: none; }
.brand.big { font-size: 1.4rem; }
.logo { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-weight: 800; }

.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head p { margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions form { margin: 0; }
.crumb { font-size: .85rem; display: inline-block; margin-bottom: 4px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h2 { margin: 0; }
.count { font-size: .8rem; color: var(--muted); background: var(--surface-2); padding: 2px 8px; border-radius: 99px; margin-left: 4px; font-weight: 500; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-2 .card { margin-bottom: 0; }

/* ---------- tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 2px; color: var(--text); box-shadow: var(--shadow); }
a.tile:hover { border-color: var(--brand); text-decoration: none; }
.tile .label { font-size: .8rem; color: var(--muted); }
.tile .value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .value.sm { font-size: 1.1rem; }
.tile .sub { font-size: .8rem; color: var(--muted); }
.tile.alert { border-color: var(--bad); background: var(--bad-soft); }
.tile.alert .value { color: var(--bad); }
.tile.warn { border-color: var(--warn); background: var(--warn-soft); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
tbody tr:hover { background: var(--surface-2); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.neg { color: var(--bad); font-weight: 600; }
tr.sub td { color: var(--muted); font-style: italic; }
tr.total td { font-weight: 700; border-top: 2px solid var(--text); }

.badge { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text); text-transform: capitalize; white-space: nowrap; }
.badge.s-active, .badge.s-let, .badge.s-completed { background: var(--ok-soft); color: var(--ok); }
.badge.s-vacant, .badge.s-open, .badge.s-pending, .badge.warn, .badge.p-high, .badge.s-high { background: var(--warn-soft); color: var(--warn); }

<script>
// Labels for the icon rail: shown beside the square (or below it on narrow screens)
// on hover and keyboard focus. Positioned here so the scrolling rail doesn't clip them.
(() => {
  let tip = null;
  const show = (el) => {
    if (!tip) { tip = document.createElement('div'); tip.className = 'rail-tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
    tip.textContent = el.dataset.tip;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const narrow = window.matchMedia('(max-width: 900px)').matches;
    tip.classList.toggle('below', narrow);
    if (narrow) {
      const left = Math.min(Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2), window.innerWidth - tip.offsetWidth - 8);
      tip.style.left = `${left}px`;
      tip.style.top = `${r.bottom + 8}px`;
    } else {
      tip.style.left = `${r.right + 10}px`;
      tip.style.top = `${r.top + r.height / 2 - tip.offsetHeight / 2}px`;
    }
  };
  const hide = () => { if (tip) tip.hidden = true; };
  document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip]'); if (el) show(el); });
  document.addEventListener('mouseout', (e) => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el) show(el); else hide(); });
  document.addEventListener('focusout', hide);
  window.addEventListener('scroll', hide, true);
})();

</script>

d\" class=\"\">Unpaid\u003c/a>\n    \n      \u003ca href=\"/app/invoices?status=overdue\" class=\"active\">Overdue\u003c/a>\n    \n      \u003ca href=\"/app/invoices?status=paid\" class=\"\">Paid\u003c/a>\n    \n  \u003c/nav>\n  \u003cp class=\"muted\">No invoices here.\u003c/p>\n\u003c/section>\n\n  "},"/app/invoices":{"title":"Invoices · Nexus","main":"\n\n\n\u003cheader class=\"page-head\">\n  \u003cdiv>\n    \u003ch1>Invoices\u003c/h1>\n    \u003cp class=\"muted\">Contractor and supplier invoices for maintenance. Click an unpaid invoice to pay it.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"actions\">\u003ca class=\"btn primary\" href=\"/app/invoices/new\">+ Upload invoice\u003c/a>\u003c/div>\n\u003c/header>\n\n\u003csection class=\"tiles\">\n  \u003ca class=\"tile \" href=\"/app/invoices?status=unpaid\">\u003cspan class=\"label\">Unpaid\u003c/span>\u003cspan class=\"value\">£0.00\u003c/span>\u003cspan class=\"sub\">0 invoices\u003c/span>\u003c/a>\n  \u003ca class=\"tile \" href=\"/app/invoices?status=overdue\">\u003cspan class=\"label\">Overdue\u003c/span>\u003cspan class=\"value\">£0.00\u003c/span>\u003cspan class=\"sub\">0 invoices\u003c/span>\u003c/a>\n\u003c/section>\n\n\u003csection class=\"card\">\n  \u003cnav class=\"tabs\">\n    \n      \u003ca href=\"/app/invoices\" class=\"active\">All\u003c/a>\n    \n      \u003ca href=\"/app/invoices?status=unpaid\" class=\"\">Unpaid\u003c/a>\n    \n      \u003ca href=\"/app/invoices?status=overdue\" class=\"\">Overdue\u003c/a>\n    \n      \u003ca href=\"/app/invoices?status=paid\" class=\"\">Paid\u003c/a>\n    \n  \u003c/nav>\n  \u003cp class=\"muted\">No invoices here.\u003c/p>\n\u003c/section>\n\n  "},"/app/invoices?status=paid":{"title":"Invoices · Nexus","main":"\n\n\n\u003cheader class=\"page-head\">\n  \u003cdiv>\n    \u003ch1>Invoices\u003c/h1>\n    \u003cp class=\"muted\">Contractor and supplier invoices for maintenance. Click an unpaid invoice to pay it.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"actions\">\u003ca class=\"btn primary\" href=\"/app/invoices/new\">+ Upload invoice\u003c/a>\u003c/div>\n\u003c/header>\n\n\u003csection class=\"tiles\">\n  \u003ca class=\"tile \" href=\"/app/invoices?status=unpaid\">\u003cspan class=\"label\">Unpaid\u003c/span>\u003cspan class=\"value\">£0.00\u003c/span>\u003cspan class=\"sub\">0 invoices\u003c/span>\u003c/a>\n  \u003ca class=\"tile \" href=\"/app/invoices?status=overdue\">\u003cspan class=\"label\">Overdue\u003c/span>\u003cspan class=\"value\">£0.00\u003c/span>\u003cspan class=\"sub\">0 invoices\u003c/span>\u003c/a>\n\u003c/section>\n\n\u003csection class=\"card\">\n  \u003cnav class=\"tabs\">\n    \n      \u003ca href=\"/app/invoices\" class=\"\">All\u003c/a>\n    \n      \u003ca href=\"/app/invoices?status=unpaid\" class=\"\">Unpaid\u003c/a>\n    \n      \u003ca href=\"/app/invoices?status=overdue\" class=\"\">Overdue\u003c/a>\n    \n      \u003ca href=\"/app/invoices?status=paid\" class=\"active\">Paid\u003c/a>\n    \n  \u003c/nav>\n  \u003cp class=\"muted\">No invoices here.\u003c/p>\n\u003c/section>\n\n  "}}}};
(() => {
  const root = document.getElementById('pv-root');
  let account = null;   // signed-in username
  let current = null;   // current page url

  function toast(msg) {
    document.getElementById('pv-toast-text').textContent = msg;
    const t = document.getElementById('pv-toast');
    t.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { t.hidden = true; }, 4500);
  }
  document.getElementById('pv-toast-close').addEventListener('click', () => { document.getElementById('pv-toast').hidden = true; });

  const store = {
    get() { try { return sessionStorage.getItem('nexus-preview-user'); } catch (e) { return null; } },
    set(v) { try { v ? sessionStorage.setItem('nexus-preview-user', v) : sessionStorage.removeItem('nexus-preview-user'); } catch (e) { /* ignore */ } },
  };

  async function pbkdf2(password, salt) {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: PBKDF2_ROUNDS }, key, 256);
    return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function showLogin(error) {
    account = null; current = null;
    document.title = 'Sign in · Nexus';
    document.body.className = 'auth';
    root.innerHTML = '<main class="public">' + LOGIN_HTML + '</main>';
    if (error) {
      const form = root.querySelector('form');
      const note = document.createElement('div');
      note.className = 'notice err';
      note.textContent = error;
      form.parentNode.insertBefore(note, form);
    }
    const input = root.querySelector('#login');
    if (input) input.focus();
  }

  function render(url) {
    const acct = ACCOUNTS[account];
    const page = acct && acct.pages[url];
    if (!page) { toast('That page isn’t part of this preview.'); return; }
    current = url;
    document.title = page.title;
    document.body.className = '';
    root.innerHTML = '<div class="shell"><aside class="sidebar">' + acct.sidebar + '</aside><main class="content">' + page.main + '</main></div>';
    // Highlight the menu square for the section being viewed (longest matching link wins).
    const path = url.split('?')[0];
    let best = null;
    root.querySelectorAll('.rail-btn[href]').forEach((b) => {
      b.classList.remove('active'); b.removeAttribute('aria-current');
      const h = b.getAttribute('href');
      if ((path === h || path.startsWith(h + '/')) && (!best || h.length > best.getAttribute('href').length)) best = b;
    });
    if (best) { best.classList.add('active'); best.setAttribute('aria-current', 'page'); }
    root.querySelectorAll('.bar-fill[data-h]').forEach((el) => { el.style.height = Math.max(2, Number(el.dataset.h)) + '%'; });
    window.scrollTo(0, 0);
  }

  function go(url) {
    const pages = ACCOUNTS[account].pages;
    if (pages[url]) return render(url);
    const path = url.split('?')[0];
    if (pages[path]) return render(path);
    if (/\/new(\?|$)|\/edit$|\/add-tenant$/.test(path)) return toast('Adding and editing records works in the full app. This preview is read-only.');
    toast('That page isn’t part of this preview.');
  }

  document.addEventListener('click', (e) => {
    if (!account) return;
    const a = e.target.closest('a[href]');
    if (a) {
      const href = a.getAttribute('href');
      if (!href.startsWith('/')) return;
      e.preventDefault();
      if (/\/file(\?|$)|download=1/.test(href)) toast('In the full app this opens the uploaded invoice.');
      else if (/\/export$/.test(href)) toast('In the full app this downloads all of your agency’s data.');
      else if (/\.csv$/.test(href)) toast('In the full app this downloads the user list as a spreadsheet.');
      else if (/\/admin\/backups\/(nexus|letwise)-/.test(href)) toast('In the full app this downloads the backup file.');
      else go(href);
      return;
    }
    if (e.target.closest('[data-print]')) { toast('In the full app this prints the statement or saves it as a PDF.'); return; }
    const row = e.target.closest('tr[data-href]');
    if (row && !e.target.closest('a, button, input, select')) go(row.dataset.href);
  });

  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const action = form.getAttribute('action') || (current || '').split('?')[0];
    const method = (form.getAttribute('method') || 'get').toLowerCase();

    if (action === '/login') {
      const data = new FormData(form);
      const username = String(data.get('login') || '').trim().toLowerCase();
      const acct = ACCOUNTS[username];
      const ok = acct && (await pbkdf2(String(data.get('password') || ''), acct.salt)) === acct.hash;
      if (!ok) return showLogin('Incorrect username or password.');
      account = username;
      store.set(username);
      return render(acct.home);
    }
    if (!account) return;
    if (action === '/logout') { store.set(null); return showLogin(); }
    if (method === 'get') {
      const params = new URLSearchParams();
      for (const [k, v] of new FormData(form)) if (typeof v === 'string' && v !== '') params.append(k, v);
      const url = action + (params.toString() ? '?' + params : '');
      if (ACCOUNTS[account].pages[url]) return render(url);
      return toast('Searching and filtering work in the full app. This preview shows the sample views only.');
    }
    toast('This preview is read-only. In the full app this saves your change.');
  });

  const remembered = store.get();
  if (remembered && ACCOUNTS[remembered]) { account = remembered; render(ACCOUNTS[remembered].home); } else showLogin();
})();
</script>
